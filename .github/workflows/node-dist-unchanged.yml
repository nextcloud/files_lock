name: Check node dist files

on:
  pull_request:

permissions:
  contents: read

jobs:
  changed_files:
    runs-on: ubuntu-latest-low
    permissions:
      contents: read
      pull-requests: read

    name: Check node dist files
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          list-files: shell
          filters: |
            assets:
              - 'js/**'
              - 'css/**'

      - name: Fail if any file in the assets folders changed
        if: steps.changes.outputs.assets == 'true'
        env:
          ASSETS_FILES: ${{ steps.changes.outputs.assets_files }}
        run: |
          echo "One or more files in js/ or css/ changed. Do NOT commit files in there as they will be generated automatically once a pull request is merged"
          echo "Changed files: $ASSETS_FILES"
          exit 1
